---
# tasks file for dns
- name: run my script
  ansible.builtin.script: files/get_domain.sh
  register: domains_output

- ansible.builtin.debug:
    var: domains

- name: set flag
  ansible.builtin.set_stats:
    domains: "{{ domains | combine({'voltron-net': true}) }}"
  when: domains_output.stdout_lines[0] == "localdomain"

- ansible.builtin.debug:
    var: domains

- name: set flag
  ansible.builtin.set_stats:
    domains: "{{ domains | combine({'gundam-nz': 'unicorn' }) }}"
  when: domains_output.stdout_lines[0] == "localdomain"

- ansible.builtin.debug:
    var: domains
